[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/home/container/supervisord.pid

[program:postgres]
command=postgres -D /home/container/postgres -c listen_addresses=127.0.0.1 -c unix_socket_directories=/tmp
priority=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:redis]
command=redis-server --dir /home/container/redis --bind 127.0.0.1 --port 6379
priority=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:wikilogger]
; Must run from /app: replica.js resolves its bot code relative to the working directory.
command=node /app/index.js
directory=/app
priority=10
autorestart=true
startretries=1000
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
